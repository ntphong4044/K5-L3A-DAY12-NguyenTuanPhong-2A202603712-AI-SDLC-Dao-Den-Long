<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root { --night: #0E1430; --fog: #1B2350; --lit: #FFB347; --core: #FFE9B0; --gold: #F2C14E; --danger: #FF5A5F; --text: #F5F1E6; --red: #C8102E; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000; font-size: 16px; }
  #flames { top: 12px; left: 14px; font-size: 26px; color: var(--lit); letter-spacing: 4px; }
  #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--danger); animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #topright { top: 12px; right: 14px; text-align: right; line-height: 1.5; }
  #topright b { color: var(--gold); font-size: 20px; }
  #nightname { top: 48px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.8; }
  #bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
  #bar i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFE58A66; background: #0008; }
  #bar i.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 70%); border-color: #FFE58A; box-shadow: 0 0 10px #FFE58A; }
  #cds { bottom: 14px; right: 16px; display: flex; gap: 12px; }
  .cd { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 2px solid var(--gold); background: conic-gradient(#0009 var(--p, 0%), #F2C14E33 0); }
  .cd.ready { box-shadow: 0 0 12px var(--gold); }
  #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 18px; color: var(--core); background: #0007; padding: 4px 12px; border-radius: 8px; }
  #charm { bottom: 76px; right: 16px; color: var(--red); font-weight: 700; }
  #arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--lit); filter: drop-shadow(0 0 6px var(--lit)); }
  #windwarn { top: 84px; left: 50%; transform: translateX(-50%); color: #cfe3ff; }
  #fps { bottom: 4px; left: 6px; font-size: 12px; opacity: 0.7; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(14, 20, 48, 0.82); }
  .card { width: min(560px, calc(100vw - 32px)); padding: 26px 30px; border-radius: 14px; background: #1B2350ee; border: 1px solid #F2C14E66; box-shadow: 0 0 40px #FFB34722; }
  .card h1 { margin: 0 0 6px; color: var(--lit); }
  .card h2 { margin: 0 0 8px; color: var(--gold); }
  .card p { line-height: 1.5; }
  .card .quote { font-style: italic; border-left: 3px solid var(--gold); padding-left: 12px; }
  .card table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  .card td { padding: 3px 0; } .card td:last-child { text-align: right; color: var(--gold); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  button { font: inherit; color: var(--night); background: var(--lit); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 700; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid #F5F1E655; }
  button:focus-visible { outline: 3px solid var(--core); }
  label { display: grid; grid-template-columns: 150px 1fr 40px; align-items: center; gap: 10px; margin: 10px 0; }
  kbd { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 4px; padding: 0 5px; }
  .hidden { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="hudroot" class="hidden">
  <div id="flames" class="hud"></div>
  <div id="timer" class="hud"></div>
  <div id="nightname" class="hud"></div>
  <div id="topright" class="hud"></div>
  <div id="windwarn" class="hud hidden">🍃 Gió sắp nổi…</div>
  <div id="prompt" class="hud hidden"></div>
  <div id="charm" class="hud hidden"></div>
  <div id="bar" class="hud"></div>
  <div id="cds" class="hud"><div id="cd-dash" class="cd">LƯỚT</div><div id="cd-pulse" class="cd">SÁNG</div></div>
  <div id="arrow" class="hud hidden"></div>
</div>
<div id="fps" class="hud hidden"></div>
<div id="screen" class="overlay"><div class="card" id="card"></div></div>
<script type="module" src="/web/main.js"></script>
</body>
</html>
