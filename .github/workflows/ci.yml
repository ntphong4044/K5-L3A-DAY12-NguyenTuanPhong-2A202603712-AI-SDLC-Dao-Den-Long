name: ci
on: [push, pull_request]
jobs:
  test:
    # Một hệ điều hành: lab chấm trên Linux/Windows; macOS runner của GitHub hay kẹt hàng đợi nhiều giờ
    # và mã này không dùng API riêng của macOS. Thêm lại vào matrix nếu cần thử trên macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run proof
      - run: npm run soak                 # Phase 4: 10 Đêm, crashes = 0
      - run: npm run bench:cpu -- --seed 42 --duration 3 --out "${{ runner.temp }}/bench-cpu.json"   # không có GPU trên CI: chỉ kiểm cảnh bench dựng và ghi đúng trường
      - run: npm run release              # zip bản phát hành phải tạo được và đủ tệp
